<!doctype html>
<html lang="<!-- figma:lang -->" dir="rtl">
  <head>
    <!-- figma:head-start -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title><!-- figma:title --></title>
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0f3040" />

    <!-- ===================================================================
         Link previews (WhatsApp, iMessage, Slack, Facebook, X, LinkedIn).

         Every URL below MUST be absolute. Crawlers fetch these with no
         document base, so a relative path — which is what the rest of this
         build emits on purpose, for sub-path hosting — silently yields no
         thumbnail at all. That is why the origin is spelled out here.

         og:title and og:description are injected from .figma/make/site.json
         and are deliberately not repeated in this file.
         =================================================================== -->
    <link rel="canonical" href="https://matoy7.github.io/Yamshich-Kvodo/" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://matoy7.github.io/Yamshich-Kvodo/" />
    <meta property="og:site_name" content="ימשיך כבודו" />
    <meta property="og:locale" content="he_IL" />

    <!-- 1200×630 JPEG, ~74 KB. WhatsApp renders the large card only while the
         image stays well under ~300 KB; above that it falls back to a small
         icon or none. Regenerate with: node scripts/og-image.mjs -->
    <meta property="og:image" content="https://matoy7.github.io/Yamshich-Kvodo/og-image.jpg" />
    <meta property="og:image:secure_url" content="https://matoy7.github.io/Yamshich-Kvodo/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="ימשיך כבודו — אתה מתחיל. האינטרנט משלים." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://matoy7.github.io/Yamshich-Kvodo/og-image.jpg" />
    <!-- figma:head-end -->

    <script>
      // Single-Page Apps for GitHub Pages — companion to public/404.html.
      //
      // Two things happen here, in order, and the order matters:
      //
      // 1. A <base> tag is inserted, pinned to this page's own root
      //    (computed from location.pathname *before* anything below touches
      //    it — never hardcoded, so this still works under any repo name).
      //    Without it, the module script tag at the bottom of <body> — whose
      //    fetch Chromium's preload scanner starts speculatively against the
      //    *original* URL, but which the parser also resolves "for real"
      //    against whatever the *current* URL is once it reaches that tag —
      //    ends up fetched twice: once correctly, once resolved against the
      //    deep link path below, 404ing every asset on it. <base> fixes the
      //    resolution target for every relative URL in the document, so it
      //    stays correct no matter what step 2 does to the visible URL.
      //
      // 2. The real deep-link URL (e.g. /sentence/<id>/completion/<id>) that
      //    404.html encoded into a query string is restored via
      //    history.replaceState — which does not trigger a navigation or
      //    reload — before the app below reads window.location.pathname.
      //
      // Both run as plain synchronous scripts, so both always execute before
      // the deferred module script that follows. A normal visit (no "?/"
      // query shape) leaves the page untouched either way.
      ;(function (l) {
        var base = document.createElement("base")
        base.href = l.pathname.split("?")[0].replace(/[^/]*$/, "")
        document.head.appendChild(base)

        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&")
            })
            .join("?")
          window.history.replaceState(
            null,
            "",
            l.pathname.slice(0, -1) + decoded + l.hash,
          )
        }
      })(window.location)
    </script>
  </head>
  <body>
    <!-- figma:body-start -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- figma:body-end -->
  </body>
</html>
