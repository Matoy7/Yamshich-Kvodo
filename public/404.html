<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <title>ימשיך כבודו</title>
    <script>
      // Single-Page Apps for GitHub Pages — https://github.com/rafgraph/spa-github-pages
      //
      // GitHub Pages serves this file for any path it doesn't recognise as a
      // real file — which includes every deep link, e.g.
      // /Yamshich-Kvodo/sentence/<id>/completion/<id>, since those only exist
      // as client-side routes, not as files. GitHub Pages has no server-side
      // rewrite capability at all, so without this file a shared link 404s
      // the instant someone opens or refreshes it.
      //
      // The fix: encode the real path into a query string, redirect to the
      // site's actual root (a real file, so it loads normally), and restore
      // the original URL there via history.replaceState before the app reads
      // it — see the matching snippet in index.html.
      //
      // pathSegmentsToKeep = 1: the one path segment that is the GitHub Pages
      // project prefix ("Yamshich-Kvodo"), which must be preserved as the
      // real app root rather than treated as part of the route to restore.
      var pathSegmentsToKeep = 1

      var l = window.location
      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          l.pathname
            .split("/")
            .slice(0, 1 + pathSegmentsToKeep)
            .join("/") +
          "/?/" +
          l.pathname
            .slice(1)
            .split("/")
            .slice(pathSegmentsToKeep)
            .join("/")
            .replace(/&/g, "~and~") +
          (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash,
      )
    </script>
  </head>
  <body></body>
</html>
